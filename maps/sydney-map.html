<style>
/* required styles */

.leaflet-pane,
.leaflet-tile,
.leaflet-marker-icon,

<style>
/* Layout: page header (title + note) over one full-width map; project card pops up on a point. */
:root{
  --bg:#FFFFFF; --ink:#1D1C18; --muted:#8C8B83; --line:#D9D6CE;
  --sea:#A9D2C8; --land:#FFFFFF; --edge:#C9C4BA; --sub:#A39E94; --hover:#F6EFEA;
  --card:#FFFFFF; --shadow:rgba(42,35,64,.16); --faint:#A9A69C; --dot:rgba(255,255,255,.38); --subtext:rgba(29,28,24,.55); --pin:#E2483D; --lgatext:#7A766C; --lgadeep:#55524B;
  --display:"Bodoni Moda","Didot","Times New Roman",serif; --ui:"IBM Plex Sans",system-ui,sans-serif; --mono:"IBM Plex Mono",ui-monospace,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#17161B;--ink:#EEEAF4;--muted:#A39DB0;--line:#34313C;--sea:#2C4A44;--land:#25232B;--edge:#4A4655;--sub:#34313C;--hover:#302B36;--card:#211F27;--shadow:rgba(0,0,0,.45);--faint:#6F6A78;--lgatext:#9C96A8;--lgadeep:#C4BED0;--dot:rgba(255,255,255,.08);--subtext:rgba(238,234,244,.6);color-scheme:dark}}
:root[data-theme="dark"]{--bg:#17161B;--ink:#EEEAF4;--muted:#A39DB0;--line:#34313C;--sea:#2C4A44;--land:#25232B;--edge:#4A4655;--sub:#34313C;--hover:#302B36;--card:#211F27;--shadow:rgba(0,0,0,.45);--faint:#6F6A78;--lgatext:#9C96A8;--lgadeep:#C4BED0;--dot:rgba(255,255,255,.08);--subtext:rgba(238,234,244,.6);color-scheme:dark}
body{background:var(--bg);color:var(--ink);font-family:var(--ui);margin:0}
.wrap{max-width:1280px;margin:0 auto;padding-inline:clamp(16px,4vw,48px);padding-block:40px 32px}
header{display:grid;grid-template-columns:1fr minmax(0,420px);gap:24px 48px;align-items:end;margin-bottom:24px}
@media (max-width:760px){header{grid-template-columns:1fr}}
.rule{width:48px;height:4px;background:var(--ink);margin-bottom:18px}
h1{font-family:var(--display);font-weight:400;font-size:clamp(56px,9vw,112px);line-height:.95;margin:0;letter-spacing:-.01em}
.eyebrow{font-family:var(--mono);font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:0 0 6px}
.note h2{font-family:var(--display);font-weight:500;font-size:22px;margin:0 0 8px}
.note p{margin:0 0 4px;font-size:15px;line-height:1.55;color:var(--muted)}
.note b{color:var(--ink);font-weight:500}
#map{height:min(78vh,760px);min-height:420px;border-radius:22px;overflow:hidden;background:radial-gradient(circle,var(--dot) 1.2px,transparent 1.6px) 0 0/8px 8px,var(--sea);border:1px solid var(--line)}
.leaflet-container{background:radial-gradient(circle,var(--dot) 1.2px,transparent 1.6px) 0 0/8px 8px,var(--sea);font-family:var(--ui)}
.legend{display:flex;flex-wrap:wrap;gap:8px 18px;margin-top:14px;font-size:13px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:8px}
.sw{width:14px;height:14px;border-radius:4px;border:1px solid var(--edge)}
.pin{width:14px;height:14px;border-radius:50%;background:var(--card);border:3px solid var(--pin);box-sizing:border-box}
/* project point */
.pt{width:16px;height:16px;border-radius:50%;background:var(--card);border:2.2px solid var(--pin);box-sizing:border-box;display:grid;place-items:center;box-shadow:0 2px 6px var(--shadow);transition:transform .15s}
.pt i{width:4px;height:4px;border-radius:50%;background:var(--pin)}
.pt:hover,.pt:focus-visible{transform:scale(1.25)}
.pt b{position:absolute;left:19px;top:-2px;font:700 11px var(--mono);letter-spacing:.04em;color:var(--ink);white-space:nowrap;text-shadow:0 0 3px var(--land),0 0 3px var(--land)}
#map.far .pt b{display:none}
#map.far .pt{width:11px;height:11px;border-width:2px}
#map.far .pt i{width:3px;height:3px}
.pt.n2::after{content:"2";position:absolute;right:-9px;top:-9px;width:13px;height:13px;line-height:13px!important;font-size:9px!important;border-radius:50%;background:var(--card);color:var(--pin);border:1.5px solid var(--pin);box-sizing:border-box;line-height:10px!important;font:700 10px/16px var(--ui);font-weight:700!important;-webkit-text-stroke:.3px var(--pin);text-align:center}
/* popup */
.leaflet-popup-content-wrapper{background:var(--card);color:var(--ink);border-radius:18px;box-shadow:0 14px 34px var(--shadow)}
.leaflet-popup-tip{background:var(--card)}
.leaflet-popup-content{margin:18px 20px;width:min(300px,70vw)!important}
html,body{overscroll-behavior:none}
.sbar{position:absolute;z-index:801;width:5px;border-radius:3px;pointer-events:none;opacity:0;transition:opacity .45s}
.sbar.on{opacity:1;transition:opacity .15s}
.sbar i{display:block;width:5px;border-radius:3px;background:rgba(29,28,24,.38)}
.pcard{scrollbar-width:none;-ms-overflow-style:none}.pcard::-webkit-scrollbar{display:none;width:0;height:0}
.pcard{position:absolute;z-index:800;overscroll-behavior:contain;overflow-anchor:none;width:min(320px,calc(100% - 20px));max-height:calc(100% - 20px);overflow:auto;background:var(--card);color:var(--ink);border-radius:18px;box-shadow:0 14px 34px var(--shadow);padding:18px 20px;box-sizing:border-box}
.card + .card{border-top:1px solid var(--line);margin-top:14px;padding-top:14px}
.strip{display:flex;gap:8px;overflow-x:auto;scroll-snap-type:x mandatory;margin-bottom:12px}
.strip img{flex:0 0 86%;height:170px;object-fit:contain;scroll-snap-align:start;margin-bottom:0!important}
.card img{display:block;width:100%;border-radius:10px;margin-bottom:12px;background:#fff}
.card .tag{font:500 11px var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.card h3{font-family:var(--display);font-weight:500;font-size:19px;line-height:1.2;margin:6px 0 6px;text-wrap:balance}
.card p{margin:0;font-size:14px;line-height:1.5;color:var(--muted)}
.leaflet-tooltip.lab{background:none;border:0;box-shadow:none;padding:0;font:400 12px var(--display);letter-spacing:.01em;color:var(--lgatext);white-space:nowrap;text-shadow:0 0 2px var(--land),0 0 2px var(--land)}
.leaflet-tooltip.lab.has{font:400 12px var(--display);color:var(--lgatext);text-shadow:none}
.leaflet-tooltip.lab.sub{font:400 11px var(--display);color:var(--lgatext);text-shadow:none}
#map.near .leaflet-tooltip.lab:not(.sub){font-weight:700;font-size:15px;color:var(--lgadeep)}
.leaflet-tooltip.lab::before{display:none}
.leaflet-tooltip.lab.off{display:none}
.leaflet-tooltip.lga{background:var(--card);color:var(--ink);border:0;box-shadow:0 4px 12px var(--shadow);font:500 12px var(--ui);border-radius:8px;padding:4px 8px}
.leaflet-control-zoom a{background:var(--card)!important;color:#4F9484!important;border-color:#7FB8AA!important;font-weight:600}
.leaflet-control-zoom a:hover{background:#EEF6F3!important}
.leaflet-touch .leaflet-bar,.leaflet-bar{border:1.5px solid #7FB8AA!important;box-shadow:0 2px 8px rgba(79,148,132,.18)!important}
.leaflet-control-zoom a.leaflet-disabled{color:#B9D6CF!important}
.hint{position:absolute;inset:auto 0 16px 0;margin:auto;width:max-content;max-width:90%;z-index:500;background:var(--ink);color:var(--bg);font-size:13px;padding:8px 14px;border-radius:999px;opacity:0;transition:opacity .25s;pointer-events:none}
.hint.on{opacity:.9}
@media (prefers-reduced-motion:reduce){.pt,.hint{transition:none}}

html.embed body{background:transparent}
html.embed .wrap{max-width:none;padding:0}
html.embed header,html.embed .legend{display:none}
html.embed #map{height:100vh;min-height:0;border:2px solid #7FB8AA;border-radius:28px;box-sizing:border-box}
@media (max-width:760px){html.embed #map{border-radius:14px}}
</style>

<body>
<div class="wrap">
  <header>
    <div><div class="rule"></div><p class="eyebrow">01 · New South Wales</p><h1>Sydney</h1></div>
    <div class="note"><h2>My work, mapped</h2>
      <p><b>12 projects · 9 councils.</b> Coloured councils hold my work.</p>
      <p>Zoom out to see all of NSW, zoom in for Sydney suburbs. Click a point to open its project.</p></div>
  </header>
  <div id="map" role="region" aria-label="Interactive map of Lia's projects in Greater Sydney"></div>
  <div class="legend"><span><i class="pin"></i>Project location</span></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>
const COL={"Hawkesbury":"#DCE39A","The Hills Shire":"#F4C7B5","Blacktown":"#C7B8EA","Parramatta":"#EE9988","Canterbury-Bankstown":"#E7AFC0","Ryde":"#9DB1E8","Ku-ring-gai":"#F2D3B8","Sydney":"#A9A3E3","Randwick":"#F0B48A"};
const P=[
 {t:"Bridging Community: Flood-Resilient Urban Design for Windsor",s:"Windsor",tag:"Urban design · 2024",ll:[-33.6121,150.8131],d:"Links rooftops and vacant upper floors into shared spaces that double as flood evacuation routes.",img:"img/windsor-section.jpg"},
 {t:"Planning for Growth in TOD Precincts: Kellyville and Bella Vista",s:"Kellyville",tag:"Strategic planning",ll:[-33.722,150.952],d:"Growth, housing and transport around the Kellyville and Bella Vista metro stations.",img:"img/kellyville-street.jpg"},
 {t:"Assessing Spatial Equity of Amenities in Blacktown",s:"Blacktown",tag:"GIS · StoryMap",ll:[-33.771,150.906],d:"Hot spot analysis of amenity access compared with population density and the IRSAD index.",img:"img/blacktown.jpg"},
 {t:"Social Impact Assessment: Rehabilitation Centre in Blacktown",s:"Blacktown",tag:"Social impact",ll:[-33.771,150.906],d:"Scoping the social impacts of a proposed drug and alcohol rehabilitation centre.",img:"img/blacktown-sia.jpg"},
 {t:"Parramatta in Transition: Urban Renewal in Sydney's Second CBD",s:"Parramatta",tag:"Urban renewal · 2025",ll:[-33.815,151.0036],d:"How Parramatta Square, light rail, flood planning and smart city projects reshape the CBD."},
 {t:"Property Development Report and Feasibility Analysis",s:"Chester Hill",tag:"Development",ll:[-33.874,150.992],d:"Residual land valuation and a 10-year DCF feasibility for a development site.",img:"img/property.jpg"},
 {t:"Macquarie Park TOD: Last-Mile Connectivity and Open Space",s:"Macquarie Park",tag:"Transport · 2025",ll:[-33.777,151.124],d:"Transport and open space proposals for a fast-growing transit-oriented precinct.",img:"img/macquarie.jpg"},
 {t:"Urban Design for East Killara",s:"East Killara",tag:"Urban design · 2025",ll:[-33.756,151.181],d:"A mixed-use local centre spine with 'missing middle' housing within a 5-minute walk.",img:"img/killara-legend.jpg"},
 {t:"Urban Design Journal: George Street, The Rocks",s:"The Rocks",tag:"Urban design",ll:[-33.859,151.208],d:"Reading George Street as a sequence of spaces, from the markets to the Harbour Bridge.",imgs:["img/rocks-sketch1.jpg","img/rocks-sketch2.jpg","img/rocks-plan.jpg"]},
 {t:"PedLight-SAC: RL Traffic Signals with Pedestrian Equity",s:"Kensington",tag:"Transport · AI · 2026",ll:[-33.917,151.223],d:"Reinforcement learning signal control that cuts pedestrian waits on Anzac Parade.",img:"img/pedlight-network.jpg"},
 {t:"Data Literacy and Smart Cities: UNSW Students",s:"Kensington",tag:"Smart cities",ll:[-33.917,151.223],d:"How willing UNSW students are to share personal data for smart city services.",img:"img/data-literacy.jpg"},
 {t:"Waiting at the Kerb: Pedestrian Equity at Signalised Intersections",s:"Maroubra",tag:"Transport",ll:[-33.942,151.240],d:"How long pedestrians wait compared with cars at Sydney's signalised intersections.",img:"img/maroubra.jpg"}];
const css=n=>getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const map=L.map("map",{zoomControl:true,scrollWheelZoom:true,wheelPxPerZoomLevel:90,wheelDebounceTime:10,minZoom:6,maxZoom:15,zoomSnap:0,zoomDelta:.5,preferCanvas:true,attributionControl:false,fadeAnimation:false,markerZoomAnimation:true}).fitBounds([[-34.054,150.33],[-33.54,151.74]],{animate:false});
{const B=L.latLngBounds([[-34.054,150.33],[-33.54,151.74]]),z=Math.floor(map.getBoundsZoom(B)*4)/4+.5;map.setView([-33.785,151.03],z,{animate:false})}
const HOME=map.getZoom();
map.setMaxBounds([[-38.5,139.5],[-27.2,155.2]]);
// scroll only zooms with Ctrl / Cmd, so the page still scrolls
const hint=document.createElement("div");hint.className="hint";hint.textContent="Scroll to zoom · drag to move";document.getElementById("map").appendChild(hint);
setTimeout(()=>hint.classList.add("on"),600);setTimeout(()=>hint.classList.remove("on"),3600);
const labPane=map.createPane("labs");labPane.style.zIndex=450;labPane.style.pointerEvents="none";
const linePane=map.createPane("lgaLines");linePane.style.zIndex=420;linePane.style.pointerEvents="none";
const subPane=map.createPane("subs");subPane.style.zIndex=410;subPane.style.pointerEvents="none";
let lga,subs;
let lines,lineOf={};
const subsBy={},subLabsBy={};let shownSub=null;
function subStyle(){for(const k in subsBy)subsBy[k].eachLayer(l=>l.setStyle({color:css("--sub"),weight:.6,fill:false,opacity:1}))}
function subsFor(){}
function resetOne(l,name){l.setStyle({fillColor:COL[name]||css("--land"),fillOpacity:1,color:css("--edge"),weight:1});const ln=lineOf[name];if(ln)ln.setStyle({fill:false,color:css("--edge"),weight:1})}
function style(){if(lga)lga.setStyle(f=>({fillColor:COL[f.properties.name]||css("--land"),fillOpacity:1,color:css("--edge"),weight:1}));if(lines)lines.setStyle({fill:false,color:css("--edge"),weight:1});subStyle()}
const labs=[];let hov=null,hovName=null;
let fitRaf=0;function fitLabels(){if(fitRaf)return;fitRaf=requestAnimationFrame(()=>{fitRaf=0;fitNow()})}
function fitNow(){labs.forEach(({l,t,has})=>{const b=l._bb||(l._bb=l.getBounds()),a=map.latLngToContainerPoint(b.getNorthWest()),c=map.latLngToContainerPoint(b.getSouthEast());
  const w=c.x-a.x,h=c.y-a.y,ok=has?(w>34&&h>18):l===hov;const el=t.getElement();if(el)el.classList.toggle("off",!ok)})}
fetch("lga.geojson").then(r=>r.json()).then(g=>{
  lga=L.geoJSON(g,{renderer:L.canvas({padding:.5,tolerance:2}),onEachFeature:(f,l)=>{const has=!!COL[f.properties.name];
    l.on("mouseover",()=>{hovName=f.properties.name;l.setStyle({color:"#87837A",weight:1.9});l.bringToFront();const ln=lineOf[f.properties.name];if(ln){ln.setStyle({color:"#87837A",weight:1.9});ln.bringToFront()}if(!has){l.setStyle({fillColor:css("--hover")});hov=l;fitLabels()}subsFor(hovName,true);toggleSubs(true)});
    l.on("mouseout",()=>{resetOne(l,f.properties.name);subsFor(f.properties.name,false);if(hovName===f.properties.name)hovName=null;if(hov===l){hov=null;fitLabels()}toggleSubs(true)})}}).addTo(map);
  lines=L.geoJSON(g,{pane:"lgaLines",renderer:L.canvas({pane:"lgaLines",padding:.5}),interactive:false,smoothFactor:1.2,onEachFeature:(f,l)=>{lineOf[f.properties.name]=l}}).addTo(map);style();
  lga.eachLayer(l=>{const name=l.feature.properties.name,has=!!COL[name];
    const t=L.tooltip({pane:"labs",permanent:true,direction:"center",className:"lab"+(has?" has":""),interactive:false}).setLatLng(l.getCenter()).setContent(name);t.addTo(map);labs.push({l,t,has})});
  fitLabels();map.on("zoomend moveend",fitLabels);
  fetch("suburbs.geojson").then(r=>r.json()).then(s=>{subs=L.geoJSON(s,{pane:"subs",renderer:L.canvas({pane:"subs",padding:.5}),interactive:false,smoothFactor:1.5});subs.eachLayer(l=>{const k=l.feature.properties.lga;(subsBy[k]=subsBy[k]||L.layerGroup()).addLayer(l)});subStyle();toggleSubs()});
});
function fitSub(t){const el=t.getElement();if(!el)return;const b=t._lb.getBounds(),a=map.latLngToContainerPoint(b.getNorthWest()),c=map.latLngToContainerPoint(b.getSouthEast());el.classList.toggle("off",c.x-a.x<34||c.y-a.y<12)}
function toggleSubs(){if(!subs)return;const want=map.getZoom()>=11.5&&hovName&&subsBy[hovName]?hovName:null;
  if(shownSub!==want){if(shownSub){map.removeLayer(subsBy[shownSub]);if(subLabsBy[shownSub])map.removeLayer(subLabsBy[shownSub])}
    shownSub=want;if(want){subsBy[want].addTo(map);
      if(!subLabsBy[want]){const g=L.layerGroup();subsBy[want].eachLayer(l=>{const t=L.tooltip({pane:"labs",permanent:true,direction:"center",className:"lab sub",interactive:false}).setLatLng(l.getBounds().getCenter()).setContent(l.feature.properties.name);t._lb=l;g.addLayer(t)});subLabsBy[want]=g}
      subLabsBy[want].addTo(map)}}
  if(shownSub)subLabsBy[shownSub].eachLayer(fitSub)}
map.on("zoomend moveend",toggleSubs);
const farCheck=()=>{map.getContainer().classList.toggle("far",map.getZoom()<9);map.getContainer().classList.toggle("near",map.getZoom()>=11.5)};map.on("zoomend",farCheck);farCheck();
// two-finger pinch on a trackpad zooms the map, not the page
(()=>{const el=map.getContainer();let z0=null,pt=null;
  el.addEventListener("gesturestart",e=>{e.preventDefault();z0=map.getZoom();const r=el.getBoundingClientRect();pt=L.point(e.clientX-r.left,e.clientY-r.top)},{passive:false});
  let gz=null,graf=0;el.addEventListener("gesturechange",e=>{e.preventDefault();if(z0==null)return;gz=Math.max(map.getMinZoom(),Math.min(map.getMaxZoom(),z0+Math.log2(e.scale)));if(!graf)graf=requestAnimationFrame(()=>{graf=0;if(gz!=null)map.setZoomAround(pt,gz,{animate:false})})},{passive:false});
  el.addEventListener("gestureend",e=>{e.preventDefault();z0=null},{passive:false});
  el.addEventListener("wheel",e=>{if(e.ctrlKey)e.preventDefault()},{passive:false});
  document.addEventListener("gesturestart",e=>e.preventDefault(),{passive:false});
  document.addEventListener("touchmove",e=>{if(e.touches&&e.touches.length>1)e.preventDefault()},{passive:false})})();
// drag to move the map (left button / trackpad press, or the middle wheel button); open cards move with it
let panning=false;map.on("dragstart",()=>panning=true);map.on("dragend",()=>setTimeout(()=>panning=false,50));
(()=>{const el=map.getContainer();let last=null;
  el.addEventListener("mousedown",e=>{if(e.button!==1)return;e.preventDefault();last=[e.clientX,e.clientY];panning=true;el.style.cursor="grabbing"});
  window.addEventListener("mousemove",e=>{if(!last)return;map.panBy([last[0]-e.clientX,last[1]-e.clientY],{animate:false});last=[e.clientX,e.clientY]});
  window.addEventListener("mouseup",e=>{if(!last)return;last=null;el.style.cursor="";setTimeout(()=>panning=false,50)});
  el.addEventListener("auxclick",e=>{if(e.button===1)e.preventDefault()})})();
// floating project card: opens on whichever side of the point has room, so the whole card stays visible
const card=document.createElement("div");card.className="pcard";card.hidden=true;card.setAttribute("role","dialog");map.getContainer().appendChild(card);
L.DomEvent.disableClickPropagation(card);L.DomEvent.disableScrollPropagation(card);
// scrolling never moves the web page while the pointer is on the map:
// on the project card it scrolls the card only; everywhere else the map handles it (zoom)
card.addEventListener("wheel",e=>{e.preventDefault();e.stopPropagation();card.scrollTop+=e.deltaMode===1?e.deltaY*16:e.deltaY},{passive:false});
document.addEventListener("wheel",e=>{if(!card.contains(e.target))e.preventDefault()},{passive:false,capture:true});
let cardM=null,ct=null;const keepCard=()=>clearTimeout(ct),hideLater=()=>{clearTimeout(ct);ct=setTimeout(()=>{if(!panning){card.hidden=true;cardM=null;sbar.classList.remove("on")}},350)};
card.addEventListener("mouseenter",keepCard);card.addEventListener("mouseleave",hideLater);
function placeCard(){if(!cardM||card.hidden)return;const M=map.getSize(),pt=map.latLngToContainerPoint(cardM.getLatLng()),w=card.offsetWidth,h=card.offsetHeight,g=16,pad=10;
  const opts=[["r",pt.x+g,pt.y-h/2],["l",pt.x-g-w,pt.y-h/2],["t",pt.x-w/2,pt.y-g-h],["b",pt.x-w/2,pt.y+g]];
  const vis=([,x,y])=>Math.max(0,Math.min(x+w,M.x-pad)-Math.max(x,pad))*Math.max(0,Math.min(y+h,M.y-pad)-Math.max(y,pad));
  let best=opts.find(o=>{const r=o[1]>=pad&&o[2]>=pad&&o[1]+w<=M.x-pad&&o[2]+h<=M.y-pad;return r&&o[0]!=="t"&&o[0]!=="b"})||opts.find(o=>o[1]>=pad&&o[2]>=pad&&o[1]+w<=M.x-pad&&o[2]+h<=M.y-pad);
  if(!best){best=opts.slice().sort((a,b)=>vis(b)-vis(a))[0]}
  let [side,x,y]=best;y=Math.max(pad,Math.min(y,M.y-pad-h));x=Math.max(pad,Math.min(x,M.x-pad-w));
  card.style.left=Math.round(x)+"px";card.style.top=Math.round(y)+"px";card.dataset.side=side}
function showCard(m,html){setTimeout(()=>{placeCard();drawBar(true)},30);if(cardM!==m){card.innerHTML=html;card.scrollTop=0;card.querySelectorAll("img").forEach(im=>{if(!im.complete)im.addEventListener("load",placeCard,{once:true})})}
  cardM=m;card.hidden=false;placeCard()}
// scroll hint: a thin bar on the card's right edge, shown when the card opens (if it can scroll), then fades
const sbar=document.createElement("div");sbar.className="sbar";sbar.innerHTML="<i></i>";map.getContainer().appendChild(sbar);
let sbT=null;function drawBar(show){if(card.hidden||card.scrollHeight<=card.clientHeight+2){sbar.classList.remove("on");return}
  const r=card.getBoundingClientRect(),m=map.getContainer().getBoundingClientRect(),h=card.clientHeight-28,th=Math.max(28,h*card.clientHeight/card.scrollHeight),t=(h-th)*card.scrollTop/(card.scrollHeight-card.clientHeight);
  sbar.style.left=(r.right-m.left-9)+"px";sbar.style.top=(r.top-m.top+14)+"px";sbar.style.height=h+"px";sbar.firstChild.style.height=th+"px";sbar.firstChild.style.transform=`translateY(${t}px)`;
  if(show){sbar.classList.add("on");clearTimeout(sbT);sbT=setTimeout(()=>sbar.classList.remove("on"),1800)}}
card.addEventListener("scroll",()=>drawBar(true),{passive:true});
new ResizeObserver(()=>{placeCard();drawBar(false)}).observe(card);
map.on("move zoom",()=>{placeCard();drawBar(false)});map.on("zoomstart",()=>{card.hidden=true;cardM=null;sbar.classList.remove("on")});
map.on("click",()=>{card.hidden=true;cardM=null;sbar.classList.remove("on")});
// group projects that share a point
const groups={};P.forEach(p=>{const k=p.ll.join();(groups[k]=groups[k]||[]).push(p)});
const esc=s=>s.replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
Object.values(groups).forEach(ps=>{const p=ps[0];
  const icon=L.divIcon({className:"",html:`<div class="pt${ps.length>1?" n2":""}" tabindex="0" role="button" aria-label="${esc(p.s)}: ${ps.length} project${ps.length>1?"s":""}"><i></i><b>${esc(p.s)}</b></div>`,iconSize:[16,16],iconAnchor:[8,8]});
  const html=ps.map(q=>`<div class="card">${q.imgs?`<div class="strip">${q.imgs.map(u=>`<img src="${u}" alt="">`).join("")}</div>`:q.img?`<img src="${q.img}" alt="">`:""}<span class="tag">${esc(q.s)} · ${esc(q.tag)}</span><h3>${esc(q.t)}</h3><p>${esc(q.d)}</p></div>`).join("");
  const m=L.marker(p.ll,{icon,keyboard:true,riseOnHover:true}).addTo(map);
  m.on("mouseover",()=>{keepCard();showCard(m,html)});m.on("mouseout",hideLater);
  m.on("click",()=>{keepCard();showCard(m,html)});
  m.on("add",()=>{const el=m.getElement();el&&el.addEventListener("keydown",e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();showCard(m,html)}})});
});
matchMedia("(prefers-color-scheme: dark)").addEventListener("change",style);
new MutationObserver(style).observe(document.documentElement,{attributes:true,attributeFilter:["data-theme"]});
</script>
