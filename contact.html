<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Contact · Lia Wun</title>
<meta name="description" content="Lia Wun (Tsz Yee Wun) — city planner and traffic engineer in Sydney. Transport, GIS and spatial analysis, urban design and AI.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:opsz,wght@6..96,400;6..96,500;6..96,700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="assets/site.css?v=202610111844">
</head>
<body>
<div class="app" id="app">
  <header>
    <h1>Lia Wun · V2.0</h1>
    <div class="pages" id="pages" role="tablist" aria-label="Pages"></div>
    <span class="sp"></span>
    <button class="btn" id="undo" title="Undo (Ctrl/⌘+Z)">Undo</button>
    <button class="btn" id="grid">Grid</button>
    <button class="btn" id="darkBtn">Dark page</button>
    <button class="btn" id="reset">Reset page</button>
    <button class="btn" id="import">Import</button>
    <button class="btn" id="exportBtn">Export for AI</button>
    <button class="btn primary" id="previewBtn">Preview</button>
  </header>

  <aside class="left">
    <section>
      <p class="h">素材库 Asset library</p>
      <div class="assets" id="assets"></div>
      <p class="hint" style="margin-top:10px">Click an asset to add it to the page you are on. Upload your own art (PNG / SVG) with the last tile.</p>
      <input type="file" id="file" accept="image/png,image/svg+xml,image/jpeg,image/webp" hidden>
      <input type="file" id="photoFile" accept="image/png,image/jpeg,image/webp" hidden>
    </section>
    <section>
      <p class="h">图层 Layers <span style="text-transform:none;letter-spacing:0">(top first)</span></p><p class="hint" style="margin:0 0 6px">Click a name here to pick something hidden under another item.</p>
      <div class="layers" id="layers"></div>
    </section>
  </aside>

  <main id="main">
    <div class="board" id="board">
      <svg id="svg" viewBox="0 0 1440 900" xmlns="http://www.w3.org/2000/svg"></svg>
      <span class="dim" id="dim"></span>
      <div class="glass" id="glass" aria-hidden="true"></div>
    </div>
  </main>

  <aside class="right" id="inspector"></aside>
</div>

<script>window.SITE_PAGE="p4";window.SITE_V="202610111844";</script>
<script src="assets/site.js?v=202610111844"></script>

</html>
