<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lia's Sydney Project Map</title>
<script>if(/embed/.test(location.search))document.documentElement.classList.add("embed")</script>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:opsz,wght@6..96,400;6..96,500;6..96,700&family=IBM+Plex+Sans:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500;700&display=swap">
<style>
:root{--bg:#FFFFFF;--ink:#1D1C18;--muted:#8C8B83;--line:#D9D6CE;--card:#FFFFFF;--shadow:rgba(42,35,64,.16);--pin:#E2483D;--lgatext:#7A766C;--lgadeep:#55524B;
  --display:"Bodoni Moda","Didot","Times New Roman",serif;--ui:"IBM Plex Sans",system-ui,sans-serif;--mono:"IBM Plex Mono",ui-monospace,monospace}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--ui)}
.wrap{max-width:1280px;margin:0 auto;padding:40px clamp(16px,4vw,48px) 32px}
header{display:grid;grid-template-columns:1fr minmax(0,420px);gap:24px 48px;align-items:end;margin-bottom:24px}
@media (max-width:760px){header{grid-template-columns:1fr}}
.rule{width:48px;height:4px;background:var(--ink);margin-bottom:18px}
h1{font-family:var(--display);font-weight:400;font-size:clamp(56px,9vw,112px);line-height:.95;margin:0}
.eyebrow{font-family:var(--mono);font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:0 0 6px}
.note h2{font-family:var(--display);font-weight:500;font-size:22px;margin:0 0 8px}
.note p{margin:0 0 4px;font-size:15px;line-height:1.55;color:var(--muted)}.note b{color:var(--ink);font-weight:500}
#map{position:relative;aspect-ratio:1200/525;border-radius:22px;overflow:hidden;border:1px solid var(--line);background:#A9D2C8}
html.embed body{background:transparent}html.embed .wrap{max-width:none;padding:0}html.embed header{display:none}
html.embed #map{border:0;border-radius:0;height:100vh;aspect-ratio:auto}
#map>img,#map>svg{position:absolute;inset:0;width:100%;height:100%;display:block}
#map>img{object-fit:cover;user-select:none;-webkit-user-drag:none}
/* councils: invisible until hovered, then they lift */
.lga{fill-opacity:0;stroke:none;cursor:pointer;transform-box:fill-box;transform-origin:center;transition:transform .25s cubic-bezier(.2,.8,.3,1.2),fill-opacity .15s}
.lga:hover,.lga.on{fill-opacity:1;stroke:#87837A;stroke-width:1.9;vector-effect:non-scaling-stroke;transform:scale(1.035);filter:drop-shadow(0 6px 10px rgba(29,28,24,.22))}
.lab{font:400 12px var(--display);fill:var(--lgatext);pointer-events:none;text-anchor:middle;dominant-baseline:central;transition:font-size .2s}
.lab.on{font-weight:700;font-size:14px;fill:var(--lgadeep)}
/* project points */
.pin{cursor:pointer;transform-box:view-box;transition:transform .2s cubic-bezier(.2,.8,.3,1.4);outline:none}
.pin:hover,.pin:focus-visible,.pin.on{transform:scale(1.3)}
.pin .ring{fill:#fff;stroke:var(--pin);stroke-width:2.2;filter:drop-shadow(0 2px 3px rgba(42,35,64,.25))}
.pin .dot{fill:var(--pin)}
.pin text{font:700 11px var(--mono);letter-spacing:.04em;fill:var(--ink);paint-order:stroke;stroke:#fff;stroke-width:3px;stroke-linejoin:round}
.pin .badge circle{fill:#fff;stroke:var(--pin);stroke-width:1.5}.pin .badge text{font:700 9px var(--ui);fill:var(--pin);stroke:none;text-anchor:middle;dominant-baseline:central;letter-spacing:0}
.pin .hit{fill:transparent}
/* little bounce when the map first appears */
@keyframes drop{0%{opacity:0;transform:translateY(-14px)}60%{opacity:1;transform:translateY(2px)}100%{transform:none}}
.pins.go .pin>.in{animation:drop .5s cubic-bezier(.2,.8,.3,1.2) both}
@media (prefers-reduced-motion:reduce){.pins.go .pin>.in{animation:none}.lga,.pin{transition:none}}
/* project card */
.pcard{position:absolute;z-index:5;overflow-anchor:none;width:min(320px,calc(100% - 20px));max-height:calc(100% - 20px);overflow:auto;background:var(--card);border-radius:18px;box-shadow:0 14px 34px var(--shadow);padding:18px 20px;box-sizing:border-box;opacity:0;transform:translateY(6px) scale(.98);transition:opacity .18s,transform .18s;pointer-events:none}
.pcard.on{opacity:1;transform:none;pointer-events:auto}
.card+.card{border-top:1px solid var(--line);margin-top:14px;padding-top:14px}
.strip{display:flex;gap:8px;overflow-x:auto;scroll-snap-type:x mandatory;margin-bottom:12px}
.strip img{flex:0 0 86%;height:170px;object-fit:contain;scroll-snap-align:start;margin-bottom:0!important}
.card img{display:block;width:100%;max-height:150px;object-fit:cover;border-radius:10px;margin-bottom:12px;background:#fff}
.card .tag{font:500 11px var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.card h3{font-family:var(--display);font-weight:500;font-size:19px;line-height:1.2;margin:6px 0;text-wrap:balance}
.card p{margin:0;font-size:14px;line-height:1.5;color:var(--muted)}
</style>
</head>

function place(pin){const r=map.getBoundingClientRect(),k=r.width/1200,ky=r.height/525,s=Math.max(k,ky),ox=(r.width-1200*s)/2,oy=(r.height-525*s)/2;
