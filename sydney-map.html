<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">

<title>Lia's Sydney Project Map</title>
<script>if(/embed/.test(location.search))document.documentElement.classList.add("embed")</script>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:opsz,wght@6..96,400;6..96,500;6..96,700&family=IBM+Plex+Sans:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500;700&display=swap">
<style>
:root{--bg:#FFFFFF;--ink:#1D1C18;--muted:#8C8B83;--line:#D2CDC3;--card:#FFFFFF;--shadow:rgba(42,35,64,.16);--pin:#E2483D;--lgatext:#7A766C;--lgadeep:#55524B;
  --display:"Bodoni Moda","Didot","Times New Roman",serif;--ui:"IBM Plex Sans",system-ui,sans-serif;--mono:"IBM Plex Mono",ui-monospace,monospace}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--ui)}
.wrap{max-width:1280px;margin:0 auto;padding:40px clamp(16px,4vw,48px) 32px}
header{display:grid;grid-template-columns:1fr minmax(0,420px);gap:24px 48px;align-items:end;margin-bottom:24px}
@media (max-width:760px){header{grid-template-columns:1fr}}
.rule{width:48px;height:4px;background:var(--ink);margin-bottom:18px}
h1{font-family:var(--display);font-weight:400;font-size:clamp(56px,9vw,112px);line-height:.95;margin:0}
.eyebrow{font-family:var(--mono);font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:0 0 6px}
.note h2{font-family:var(--display);font-weight:500;font-size:22px;margin:0 0 8px}
.note p{margin:0 0 4px;font-size:15px;line-height:1.55;color:var(--muted)}.note b{color:var(--ink);font-weight:500}
/* the frame: a fixed window onto bigger pictures; border on all four edges */
#map{position:relative;aspect-ratio:1200/525;border-radius:22px;overflow:hidden;border:1.5px solid var(--line);box-sizing:border-box;
  background:radial-gradient(circle,rgba(255,255,255,.38) 1.2px,transparent 1.6px) 0 0/8px 8px,#A9D2C8;touch-action:none;cursor:grab;user-select:none;-webkit-user-select:none}
#map.drag{cursor:grabbing}
html.embed body{background:transparent}html.embed .wrap{max-width:none;padding:0}html.embed header{display:none}
html.embed #map{height:100vh;aspect-ratio:auto}
.layer{position:absolute;left:0;top:0;transform-origin:0 0;pointer-events:none;-webkit-user-drag:none;transition:opacity .3s}
.layer.off{opacity:0}
svg.world{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.lga{fill-opacity:0;stroke:none;cursor:pointer;transform-box:fill-box;transform-origin:center;transition:transform .25s cubic-bezier(.2,.8,.3,1.2),fill-opacity .15s}
.lga:hover{fill-opacity:1;stroke:#87837A;stroke-width:1.9;vector-effect:non-scaling-stroke;transform:scale(1.035);filter:drop-shadow(0 6px 10px rgba(29,28,24,.22))}
#map.drag .lga{pointer-events:none}
.lab{position:absolute;transform:translate(-50%,-50%);font:400 12px var(--display);color:var(--lgatext);white-space:nowrap;pointer-events:none;transition:font-size .2s}
.lab.on{font-weight:700;font-size:14px;color:var(--lgadeep)}
#map.z1 .lab{display:none}#map.z3 .lab{font-weight:700;font-size:15px;color:var(--lgadeep)}
.pin{position:absolute;width:16px;height:16px;margin:-8px 0 0 -8px;border-radius:50%;background:#fff;border:2.2px solid var(--pin);box-sizing:border-box;display:grid;place-items:center;cursor:pointer;box-shadow:0 2px 6px rgba(42,35,64,.25);transition:transform .2s cubic-bezier(.2,.8,.3,1.4);outline:none;z-index:2}
.pin i{width:4px;height:4px;border-radius:50%;background:var(--pin)}
.pin:hover,.pin:focus-visible,.pin.on{transform:scale(1.3);z-index:3}
.pin b{position:absolute;left:19px;top:-2px;font:700 11px var(--mono);letter-spacing:.04em;color:var(--ink);white-space:nowrap;text-shadow:0 0 3px #fff,0 0 3px #fff,0 0 2px #fff}
.pin.n2::after{content:"2";position:absolute;right:-9px;top:-9px;width:13px;height:13px;border-radius:50%;background:#fff;color:var(--pin);border:1.5px solid var(--pin);box-sizing:border-box;font:700 9px/10px var(--ui);text-align:center}
#map.z1 .pin{width:11px;height:11px;margin:-5.5px 0 0 -5.5px;border-width:2px}#map.z1 .pin b,#map.z1 .pin.n2::after{display:none}#map.z1 .pin i{width:3px;height:3px}
@keyframes drop{0%{opacity:0;translate:0 -14px}60%{opacity:1;translate:0 2px}100%{translate:0 0}}
#map.go .pin{animation:drop .5s cubic-bezier(.2,.8,.3,1.2) both}
/* zoom buttons */
.zoom{position:absolute;left:12px;top:12px;z-index:6;display:flex;flex-direction:column;border-radius:10px;overflow:hidden;box-shadow:0 2px 8px rgba(42,35,64,.18);border:1px solid var(--line)}
.zoom button{width:34px;height:34px;border:0;background:#fff;color:var(--ink);font:500 20px/1 var(--ui);cursor:pointer;display:grid;place-items:center}
.zoom button+button{border-top:1px solid var(--line)}.zoom button:hover{background:#F6F3EE}.zoom button:disabled{color:#C9C4BA;cursor:default;background:#fff}
.zoom button:focus-visible{outline:2px solid #EE9988;outline-offset:-2px}
.hint{position:absolute;right:12px;bottom:10px;z-index:6;font:500 11px var(--mono);letter-spacing:.04em;color:var(--muted);background:rgba(255,255,255,.85);padding:4px 8px;border-radius:8px;pointer-events:none}
@media (max-width:760px){.hint{display:none}}
/* project card */
.pcard{position:absolute;z-index:8;overflow-anchor:none;width:min(320px,calc(100% - 20px));max-height:calc(100% - 20px);overflow:auto;background:var(--card);border-radius:18px;box-shadow:0 14px 34px var(--shadow);padding:18px 20px;box-sizing:border-box;opacity:0;transform:translateY(6px) scale(.98);transition:opacity .18s,transform .18s;pointer-events:none;cursor:auto}
.pcard.on{opacity:1;transform:none;pointer-events:auto}
.card+.card{border-top:1px solid var(--line);margin-top:14px;padding-top:14px}
.strip{display:flex;gap:8px;overflow-x:auto;scroll-snap-type:x mandatory;margin-bottom:12px}
.strip img{flex:0 0 86%;height:170px;object-fit:contain;scroll-snap-align:start;margin-bottom:0!important}
.card img{display:block;width:100%;max-height:150px;object-fit:cover;border-radius:10px;margin-bottom:12px;background:#fff}
.card .tag{font:500 11px var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.card h3{font-family:var(--display);font-weight:500;font-size:19px;line-height:1.2;margin:6px 0;text-wrap:balance}
.card p{margin:0;font-size:14px;line-height:1.5;color:var(--muted)}
@media (prefers-reduced-motion:reduce){#map.go .pin{animation:none}.lga,.pin,.layer{transition:none}}
</style>
</head>

let cur=null,curEl=null,ht=null;
const pins=D.pins.map((pin,i)=>{const el=document.createElement("div");el.className="pin"+(pin.n>1?" n2":"");el.tabIndex=0;el.setAttribute("role","button");
  el.setAttribute("aria-label",`${pin.s}: ${pin.n} project${pin.n>1?"s":""}`);el.style.animationDelay=i*60+"ms";el.innerHTML=`<i></i><b>${esc(pin.s)}</b>`;
  map.querySelector(".pins").appendChild(el);
  el.addEventListener("pointerenter",e=>{if(e.pointerType==="mouse")show(pin,el)});el.addEventListener("pointerleave",e=>{if(e.pointerType==="mouse")hideSoon()});
  el.addEventListener("pointerdown",e=>e.stopPropagation());
  el.addEventListener("click",e=>{e.stopPropagation();cur===pin&&card.classList.contains("on")?hideNow():show(pin,el)});
  el.addEventListener("focus",()=>show(pin,el));el.addEventListener("keydown",e=>{if(e.key==="Escape")hideNow()});return {el,pin}});
function scr(w){return [w[0]*s+tx,w[1]*s+ty]}
function place(){if(!cur)return;const [x,y]=scr(cur.w),w=card.offsetWidth,h=card.offsetHeight,g=16,pad=10;
  const opts=[[x+g,y-h/2],[x-g-w,y-h/2],[x-w/2,y-g-h],[x-w/2,y+g]],fits=([a,b])=>a>=pad&&b>=pad&&a+w<=W-pad&&b+h<=H-pad;
  let [cx,cy]=opts.find(fits)||opts[0];cx=Math.max(pad,Math.min(cx,W-pad-w));cy=Math.max(pad,Math.min(cy,H-pad-h));card.style.left=cx+"px";card.style.top=cy+"px"}
function show(pin,el){clearTimeout(ht);if(cur!==pin){card.innerHTML=pin.items.map(q=>`<div class="card">${q.imgs?`<div class="strip">${q.imgs.map(u=>`<img src="${u}" alt="">`).join("")}</div>`:q.img?`<img src="${q.img}" alt="">`:""}<span class="tag">${esc(q.s)} · ${esc(q.tag)}</span><h3>${esc(q.t)}</h3><p>${esc(q.d)}</p></div>`).join("");card.scrollTop=0;
  card.querySelectorAll("img").forEach(im=>im.complete||im.addEventListener("load",place,{once:true}))}
  if(curEl&&curEl!==el)curEl.classList.remove("on");el.classList.add("on");cur=pin;curEl=el;card.classList.add("on");place()}
function hideNow(){clearTimeout(ht);card.classList.remove("on");if(curEl)curEl.classList.remove("on");cur=null;curEl=null}
function hideSoon(){clearTimeout(ht);ht=setTimeout(hideNow,300)}
card.addEventListener("pointerenter",()=>clearTimeout(ht));card.addEventListener("pointerleave",hideSoon);
card.addEventListener("pointerdown",e=>e.stopPropagation());card.addEventListener("wheel",e=>e.stopPropagation(),{passive:true});
// draw
let raf=0;function draw(){raf=0;clamp();const z=zOf();
  for(const k in L){const l=L[k],b=l.bb;if(!l.el)continue;l.el.style.width=(b[2]-b[0])*s+"px";l.el.style.height=(b[3]-b[1])*s+"px";l.el.style.transform=`translate(${b[0]*s+tx}px,${b[1]*s+ty}px)`}
  L.l2.el.classList.toggle("off",z<Z2-1.6);
  if(z>=Z2+0.4)need(L.l3);if(z<=Z2-0.5)need(L.l1);
  L.l3.el.classList.toggle("off",!(z>=Z2+0.7&&L.l3.ready));
  wg.setAttribute("transform",`translate(${tx},${ty}) scale(${s})`);
  labs.forEach(l=>{const [x,y]=scr(l.w);l.el.style.left=x+"px";l.el.style.top=y+"px"});
  pins.forEach(p=>{const [x,y]=scr(p.pin.w);p.el.style.left=x+"px";p.el.style.top=y+"px"});
  map.classList.toggle("z1",z<Z2-1.6);map.classList.toggle("z3",z>=Z2+0.7);
  zin.disabled=z>=ZMAX-0.01;zout.disabled=z<=ZMIN+0.01;place()}
function req(){if(!raf)raf=requestAnimationFrame(draw)}
function zoomAt(z,mx,my){z=Math.max(ZMIN,Math.min(ZMAX,z));const ns=2**z,wx=(mx-tx)/s,wy=(my-ty)/s;s=ns;tx=mx-wx*s;ty=my-wy*s;req()}
let anim=0,target=null;function zoomTo(z,toward){cancelAnimationFrame(anim);target=z;const z0=zOf(),t0=performance.now(),dur=320,c0=[(W/2-tx)/s,(H/2-ty)/s];
  const step=t=>{const k=Math.min(1,(t-t0)/dur),e=1-Math.pow(1-k,3),zz=z0+(z-z0)*e;
    if(toward){const cx=c0[0]+(toward[0]-c0[0])*e,cy=c0[1]+(toward[1]-c0[1])*e;s=2**zz;tx=W/2-cx*s;ty=H/2-cy*s;req()}else zoomAt(zz,W/2,H/2);
    if(k<1)anim=requestAnimationFrame(step);else target=null};anim=requestAnimationFrame(step)}
const zin=map.querySelector(".zin"),zout=map.querySelector(".zout");
zin.addEventListener("click",e=>{e.stopPropagation();const z=target??zOf(),nz=STEPS().find(v=>v>z+0.05)??ZMAX;zoomTo(nz,nz<=Z2+0.01?D.centre:null)});
zout.addEventListener("click",e=>{e.stopPropagation();const z=target??zOf();zoomTo([...STEPS()].reverse().find(v=>v<z-0.05)??ZMIN)});
map.querySelector(".zoom").addEventListener("pointerdown",e=>e.stopPropagation());
// mouse wheel / trackpad pinch = zoom; two-finger trackpad swipe = move
map.addEventListener("wheel",e=>{e.preventDefault();const r=map.getBoundingClientRect(),mx=e.clientX-r.left,my=e.clientY-r.top;
  const mouseWheel=e.deltaMode===1||(Math.abs(e.deltaY)>=40&&e.deltaX===0&&Number.isInteger(e.deltaY));
  if(e.ctrlKey||mouseWheel){cancelAnimationFrame(anim);target=null;const d=e.deltaMode===1?e.deltaY*33:e.deltaY;zoomAt(zOf()-d*(e.ctrlKey?0.01:0.0025),mx,my)}
  else{tx-=e.deltaX;ty-=e.deltaY;req()}},{passive:false});
// drag with any mouse button (left or wheel-button), finger or pen; two fingers pinch
const pts=new Map();let last=null,pinch=null,moved=0;
map.addEventListener("pointerdown",e=>{if(e.button===2)return;if(e.button===1)e.preventDefault();map.setPointerCapture(e.pointerId);pts.set(e.pointerId,[e.clientX,e.clientY]);moved=0;
  if(pts.size===1)last=[e.clientX,e.clientY];if(pts.size===2){const [a,b]=[...pts.values()];pinch={d:Math.hypot(a[0]-b[0],a[1]-b[1]),z:zOf()}}});
map.addEventListener("pointermove",e=>{if(!pts.has(e.pointerId))return;pts.set(e.pointerId,[e.clientX,e.clientY]);
  if(pts.size===2&&pinch){const [a,b]=[...pts.values()],r=map.getBoundingClientRect(),d=Math.hypot(a[0]-b[0],a[1]-b[1]);zoomAt(pinch.z+Math.log2(d/pinch.d),(a[0]+b[0])/2-r.left,(a[1]+b[1])/2-r.top);return}
  if(last){const dx=e.clientX-last[0],dy=e.clientY-last[1];moved+=Math.abs(dx)+Math.abs(dy);if(moved>3){map.classList.add("drag");tx+=dx;ty+=dy;req()}last=[e.clientX,e.clientY]}});
const up=e=>{pts.delete(e.pointerId);if(pts.size<2)pinch=null;if(pts.size===1)last=[...pts.values()][0];if(!pts.size){last=null;map.classList.remove("drag")}};
map.addEventListener("pointerup",up);map.addEventListener("pointercancel",up);
map.addEventListener("auxclick",e=>{if(e.button===1)e.preventDefault()});
map.addEventListener("click",()=>{if(moved<=3&&card.classList.contains("on"))hideNow()});
addEventListener("keydown",e=>{if(e.key==="+"||e.key==="=")zin.click();if(e.key==="-")zout.click()});
// start on the council view, framed like the original picture
function home(){size();s=2**Z2;tx=W/2-D.centre[0]*s;ty=H/2-D.centre[1]*s;draw()}
home();addEventListener("resize",()=>{const z=zOf(),cx=(W/2-tx)/s,cy=(H/2-ty)/s;size();s=2**Math.max(ZMIN,z);tx=W/2-cx*s;ty=H/2-cy*s;req()});
const io=new IntersectionObserver(es=>{if(es.some(e=>e.isIntersecting)){map.classList.add("go");io.disconnect()}},{threshold:.25});io.observe(map);
</script>
